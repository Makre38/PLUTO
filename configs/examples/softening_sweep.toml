schema_version = 1

[diagnostics]
mach_every_steps = 1
mach_threshold = 0.0
sound_speed_every_steps = 1
sound_speed_threshold = 1.0e-6

[grid]
cells_per_rbhl = 8.0
margin_down = 1.3
margin_up = 1.2
margin_y = 1.3
upstream_min = 5.0

[limits]
hard_cells = 8000000
min_boundary_over_rsoft = 4.0
min_cells_per_rsoft = 2.0
warn_cells = 2000000

[output]
count = 20
runs_dir = "../../runs_3d_softening_toml"
subdir = "export"

[physics]
density = 1.0
gamma = 1.6666
mach = 0.5
mass = 1.0
sound_speed = 1.0

[softening]

[sweep]
parameter = "softening.a_soft"
values = [10.0, 3.0, 1.0, 0.3, 0.1]

[time]
cfl = 0.333
log_lambda_max = 1.0
